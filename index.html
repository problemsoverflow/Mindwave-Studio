<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PP Website</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,700&family=Space+Mono&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind -->
    <link
      href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        -webkit-font-smoothing: antialiased;
      }

      .font-exo {
        font-family: 'Exo 2', sans-serif;
      }

      .font-space-mono {
        font-family: 'Space Mono', monospace;
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div
        id='container'
        class="absolute text-white text-center"
        style="top: 50%; transform: translate(-50%, -50%); left: 50%;"
      >
        <h1 class="font-space-mono text-lg uppercase tracking-wide">
          Welcome to
        </h1>
        <p class="font-exo text-7xl">
          Mindwave Studio
        </p>

        <!-- ⭐ Added ID here -->
        <a
          id="startSessionBtn"
          href="mode.html"
          class="border px-4 py-2 rounded-lg text-sm font-space-mono uppercase mt-8 hover:bg-white hover:text-gray-800 inline-block"
        >
          Start Session
        </a>
      </div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
